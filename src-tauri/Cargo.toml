[package]
name = "plia-desktop"
version = "1.0.0"
description = "PLIA - Personalized Learning Intelligence Agent"
authors = ["PLIA Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = [ "shell-open", "http-all", "dialog-all", "fs-all" ] }

[features]
custom-protocol = [ "tauri/custom-protocol" ]
